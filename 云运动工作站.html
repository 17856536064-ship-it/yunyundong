<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云运动 · 工作台</title>
<style>
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --border:#E5E6EB; --border-strong:#C9CDD4;
  --t1:#1D2129; --t2:#4E5969; --t3:#86909C; --t4:#C9CDD4;
  --blue:#165DFF; --blue-hover:#0E42D2; --blue-bg:#E8F3FF;
  --green:#00B42A; --green-bg:#E8FFEA;
  --red:#F53F3F; --red-bg:#FFECE8;
  --orange:#FF7D00; --orange-bg:#FFF7E8;
  --purple:#722ED1;
  --mono:"JetBrains Mono","SF Mono",Consolas,"Cascadia Code",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.04);
  --shadow-hover:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#E5E6EB;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#C9CDD4}
button{font-family:var(--sans)}

/* ── 顶栏 ── */
#top{
  height:56px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 24px;
  position:sticky;top:0;z-index:100;
}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#165DFF,#4080FF);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px}
.brand h1{font-size:16px;font-weight:600;color:var(--t1);letter-spacing:.2px}
.brand p{font-size:12px;color:var(--t3);margin-top:1px}
#top .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;
  background:var(--bg);color:var(--t2);font-size:12px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.dot.warn{background:var(--orange)} .dot.err{background:var(--red)}
#clock{font-variant-numeric:tabular-nums;color:var(--t2);font-size:13px}

/* ── 布局 ── */
#shell{display:grid;grid-template-columns:200px 1fr;height:calc(100vh - 56px - 172px)}
#nav{background:#fff;border-right:1px solid var(--border);padding:16px 12px;overflow:auto}
.nav-h{font-size:11px;color:var(--t3);letter-spacing:.5px;padding:8px 12px 6px;font-weight:500}
.nav-i{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--t2);
  transition:all .15s ease;margin-bottom:2px;
}
.nav-i:hover{background:var(--bg);color:var(--t1)}
.nav-i.on{background:var(--blue-bg);color:var(--blue);font-weight:500}
.nav-i .tag{font-size:11px;color:var(--t3)}
.nav-i.on .tag{color:var(--blue)}

#main{overflow:auto;padding:20px 24px}

/* ── 卡片 ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow-hover)}
.card-t{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:4px}
.card-d{font-size:12px;color:var(--t3);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}

/* ── 表单 ── */
label{display:block;font-size:12px;color:var(--t2);margin:14px 0 6px;font-weight:500}
input,select,textarea{
  width:100%;background:#fff;border:1px solid var(--border);border-radius:8px;
  color:var(--t1);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;
  transition:all .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(22,93,255,.12)}
input::placeholder,textarea::placeholder{color:var(--t4)}
textarea{min-height:88px;resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.6}
.row{display:flex;gap:12px} .row>*{flex:1}
.row-tight{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;border:1px solid transparent;
  transition:all .15s;font-weight:500;user-select:none;
}
.btn-pri{background:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-hover)}
.btn-def{background:#fff;color:var(--t1);border-color:var(--border-strong)}
.btn-def:hover{border-color:var(--blue);color:var(--blue)}
.btn-suc{background:var(--green);color:#fff}
.btn-suc:hover{filter:brightness(.95)}
.btn-dan{background:var(--red);color:#fff}
.btn-dan:hover{filter:brightness(.95)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── 信息行 ── */
.kv{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid #F2F3F5;font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--t3)}
.kv span:last-child{color:var(--t1);font-variant-numeric:tabular-nums;max-width:60%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;
  font-size:12px;background:var(--bg);color:var(--t2);margin-right:6px}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.b{background:var(--blue-bg);color:var(--blue)}
.pill.o{background:var(--orange-bg);color:var(--orange)}
.pill.r{background:var(--red-bg);color:var(--red)}

/* ── 表格 ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--t3);font-weight:500;font-size:12px;
  padding:10px 12px;border-bottom:1px solid var(--border);background:#FAFBFC}
td{padding:12px;border-bottom:1px solid #F2F3F5;color:var(--t1)}
tr:hover td{background:#FAFBFC}
td.m{font-family:var(--mono);font-size:12px;color:var(--t2)}
td.ok{color:var(--green)} td.er{color:var(--red)}

/* ── 代码/日志 ── */
.code{
  background:#1D2129;border-radius:8px;padding:14px 16px;color:#E5E6EB;
  font-family:var(--mono);font-size:12px;line-height:1.7;
  overflow:auto;max-height:220px;white-space:pre-wrap;word-break:break-all;
}
#log{
  height:172px;background:#fff;border-top:1px solid var(--border);
  display:flex;flex-direction:column;
}
#log-bar{display:flex;align-items:center;gap:10px;padding:8px 20px;border-bottom:1px solid var(--border)}
#log-bar .t{font-size:13px;font-weight:600;color:var(--t1)}
#log-bar .sub{font-size:12px;color:var(--t3)}
#logbox{flex:1;overflow:auto;padding:10px 20px;font-family:var(--mono);font-size:12px;
  line-height:1.7;background:#FAFBFC}
#logbox div{white-space:pre-wrap;word-break:break-all}
.ts{color:var(--t4);margin-right:6px}
.ok{color:var(--green)} .err{color:var(--red)} .warn{color:var(--orange)}
.in{color:var(--blue)} .out{color:var(--purple)} .sys{color:var(--t3)}

/* ── 滑杆 ── */
.slider-row{display:flex;align-items:center;gap:12px;margin:6px 0}
.slider-row label{margin:0;min-width:64px;font-size:12px;color:var(--t2)}
input[type=range]{flex:1;accent-color:var(--blue);height:4px;padding:0;border:0;background:var(--border)}
.slider-val{min-width:52px;text-align:right;color:var(--t1);font-variant-numeric:tabular-nums;font-size:13px}

/* ── 进度条 ── */
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#165DFF,#4080FF);width:0%;
  border-radius:3px;transition:width .4s ease}

/* ── 步骤 ── */
.seq{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.st{padding:6px 12px;border-radius:6px;background:var(--bg);color:var(--t3);font-size:12px}
.st.act{background:var(--blue-bg);color:var(--blue);font-weight:500}
.st.done{background:var(--green-bg);color:var(--green)}

.msg{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.msg.show{display:block}
.msg.ok{background:var(--green-bg);color:var(--green)}
.msg.err{background:var(--red-bg);color:var(--red)}

.mono-sm{font-family:var(--mono);font-size:12px;color:var(--t2);word-break:break-all;line-height:1.6}
.hint{font-size:12px;color:var(--t3);line-height:1.6;margin-top:8px}
.dark-label{font-family:var(--mono);font-size:11px;color:var(--t3);letter-spacing:.3px}

/* ── 真实地图 ── */
.realmap{position:relative;width:100%;height:320px;background:#E8EBEE;border:1px solid var(--border);
  border-radius:8px;overflow:hidden;cursor:grab;user-select:none;touch-action:none}
.realmap:active{cursor:grabbing}
.rm-canvas{position:absolute;inset:0;overflow:hidden}
.rm-t{position:absolute;width:256px;height:256px;pointer-events:none}
.rm-svg{position:absolute;left:0;top:0;pointer-events:none}
.rm-mk{position:absolute;width:22px;height:22px;border-radius:50%;background:#C9CDD4;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
  box-shadow:0 1px 4px rgba(0,0,0,.25);border:2px solid #fff;pointer-events:none;z-index:2}
.rm-mk.on{background:var(--blue)}
.rm-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:3}
.rm-zoom button{width:28px;height:28px;border:1px solid var(--border);background:#fff;border-radius:6px;
  color:var(--t1);font-size:16px;cursor:pointer;line-height:1;box-shadow:var(--shadow)}
.rm-zoom button:hover{color:var(--blue);border-color:var(--blue)}
.rm-attr{position:absolute;left:8px;bottom:4px;font-size:10px;color:var(--t3);background:rgba(255,255,255,.75);
  padding:2px 6px;border-radius:4px;z-index:3}
.legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--t3)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--card);padding:4px;
  border-radius:10px;border:1px solid var(--border);width:fit-content}
.tab{padding:7px 16px;border-radius:7px;cursor:pointer;color:var(--t2);font-size:13px;transition:all .15s}
.tab:hover{color:var(--t1)}
.tab.on{background:var(--blue);color:#fff;font-weight:500}
</style>
</head>
<body>

<div id="top">
  <div class="logo">Y</div>
  <div class="brand">
    <h1>云运动 · 工作台</h1>
    <p>LePao 3.6.6 · 协议客户端 · rev.2026.09</p>
  </div>
  <div class="right">
    <div class="chip"><i class="dot" id="led-net"></i>已连接</div>
    <div class="chip"><i class="dot" id="led-cry"></i>SM4 就绪</div>
    <div class="chip"><i class="dot warn" id="led-auth"></i>token</div>
    <div class="chip"><select id="base-sw" onchange="switchBase(this.value)" style="background:transparent;border:0;color:var(--t2);font-size:12px;outline:none">
      <option value="proxy">本地代理 :8787</option>
      <option value="direct">直连网关</option>
    </select></div>
    <div id="clock">--:--:--</div>
  </div>
</div>

<div id="shell">
  <div id="nav">
    <div class="nav-h">核心</div>
    <div class="nav-i on" data-tab="run">跑步控制<span class="tag">RUN</span></div>
    <div class="nav-i" data-tab="auth">账号登录<span class="tag">AUTH</span></div>
    <div class="nav-i" data-tab="timer">定时挂机<span class="tag">TIMER</span></div>
    <div class="nav-h">工具</div>
    <div class="nav-i" data-tab="api">接口调试<span class="tag">API</span></div>
    <div class="nav-i" data-tab="crypto">加解密<span class="tag">SM4</span></div>
    <div class="nav-i" data-tab="track">轨迹编辑<span class="tag">GPS</span></div>
    <div class="nav-i" data-tab="hist">历史成绩<span class="tag">DATA</span></div>
    <div class="nav-h">预设</div>
    <div class="nav-i" data-preset="qualified">合格 3.0km</div>
    <div class="nav-i" data-preset="quick">快速模式</div>
    <div class="nav-i" data-preset="morning">晨跑 2.6km</div>
    <div class="nav-i" data-preset="copycfg">导出配置</div>
  </div>
  <div id="main"></div>
</div>

<div id="log">
  <div id="log-bar">
    <span class="t">运行日志</span>
    <span class="sub" id="log-count">0 条</span>
    <div style="margin-left:auto"></div>
    <button class="btn btn-def btn-sm" onclick="clearLog()">清空</button>
    <button class="btn btn-def btn-sm" onclick="exportLog()">导出</button>
  </div>
  <div id="logbox"></div>
</div>

  const mk=[0,1,2,3].map(i=>((key[i*4]<<24)|(key[i*4+1]<<16)|(key[i*4+2]<<8)|key[i*4+3])>>>0);

  let x=[0,1,2,3].map(i=>((b[i*4]<<24)|(b[i*4+1]<<16)|(b[i*4+2]<<8)|b[i*4+3])>>>0);
  const o2=dec?rk.slice().reverse():rk;

  const o=new Uint8Array(p.length);for(let i=0;i<p.length;i+=16)o.set(sm4blk(rk,p.slice(i,i+16)),i);return o;}
function sm4ecbDec(key,data){const rk=sm4ks(key);const o=new Uint8Array(data.length);
  for(let i=0;i<data.length;i+=16)o.set(sm4blk(rk,data.slice(i,i+16),true),i);
  const n=o[o.length-1];return n>=1&&n<=16?o.slice(0,o.length-n):o;}

function ff(a,b,c,d,x,s,t){return cm((b&c)|(~b&d),a,b,x,s,t);}

/* ═══ 真实地图（高德瓦片）═══ */
function lon2tile(lon,z){return (lon+180)/360*Math.pow(2,z)*256;}
function lat2tile(lat,z){
  const s=Math.sin(lat*Math.PI/180);
  return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*Math.pow(2,z)*256;
}
function tile2lon(x,z){return x/(Math.pow(2,z)*256)*360-180;}
function tile2lat(y,z){
  const n=Math.PI-2*Math.PI*y/(Math.pow(2,z)*256);
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
}

class RealMap{
  constructor(el, opt={}){
    this.el=el;
    this.z=opt.z||17;
    this.cx=lon2tile(opt.lon||117.5966, this.z);
    this.cy=lat2tile(opt.lat||31.6083, this.z);
    this.markers=[];
    this.path=[];
    el.classList.add("realmap");
    el.innerHTML=`<div class="rm-canvas"></div><div class="rm-zoom"><button data-d="1">+</button><button data-d="-1">−</button></div><div class="rm-attr">© 高德地图</div>`;
    this.canvas=el.querySelector(".rm-canvas");
    el.querySelectorAll(".rm-zoom button").forEach(b=>{
      b.onclick=e=>{e.stopPropagation();this.zoom(+b.dataset.d);};
    });
    this._bind();
    this.render();
  }
  _bind(){
    let drag=false,sx=0,sy=0,ox=0,oy=0;
    const dn=e=>{drag=true;const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;ox=0;oy=0;e.preventDefault();};
    const mv=e=>{
      if(!drag)return;
      const p=e.touches?e.touches[0]:e;
      this.cx-=(p.clientX-sx);this.cy-=(p.clientY-sy);
      sx=p.clientX;sy=p.clientY;
      this.render();
    };
    const up=()=>drag=false;
    this.el.addEventListener("mousedown",dn);
    window.addEventListener("mousemove",mv);
    window.addEventListener("mouseup",up);
    this.el.addEventListener("touchstart",dn,{passive:false});
    this.el.addEventListener("touchmove",mv,{passive:false});
    this.el.addEventListener("touchend",up);
    this.el.addEventListener("wheel",e=>{
      e.preventDefault();
      this.zoom(e.deltaY>0?-1:1);
    },{passive:false});
    this._ro=new ResizeObserver(()=>this.render());
    this._ro.observe(this.el);
  }
  zoom(d){
    const zn=Math.max(14,Math.min(18,this.z+d));
    if(zn===this.z)return;
    const f=Math.pow(2,zn-this.z);
    this.cx*=f;this.cy*=f;this.z=zn;
    this.render();
  }
  setView(lon,lat,z){
    if(z)this.z=z;
    this.cx=lon2tile(lon,this.z);
    this.cy=lat2tile(lat,this.z);
    this.render();
  }
  setMarkers(list){
    this.markers=list.map(m=>({...m,x:lon2tile(m.lon,this.z),y:lat2tile(m.lat,this.z)}));
    this.render();
  }
  setPath(pts){
    this.path=pts.map(p=>[lon2tile(p[0],this.z),lat2tile(p[1],this.z)]);
    this.render();
  }
  _tileUrl(x,y){
    return `map_tiles/${this.z}/${x}/${y}.png`;
  }
  _tileUrlNet(x,y){
    const i=((x+y)%4)+1;
    return `https://wprd0${i}.is.autonavi.com/appmaptile?x=${x}&y=${y}&z=${this.z}&lang=zh_cn&size=1&scl=1&style=7`;
  }

  animateTrack(pts, onStep, ms=200){
    this.setPath([]);
    const n=pts.length;
    let i=1;
    this._animTimer&&clearInterval(this._animTimer);
    this._animTimer=setInterval(()=>{
      if(i>=n){clearInterval(this._animTimer);this._animTimer=null;return;}
      this.setPath(pts.slice(0,i+1));
      onStep&&onStep(i,n,pts[i]);
      i++;
    },ms);
  }
  render(){
    const w=this.el.clientWidth||600, h=this.el.clientHeight||320;
    const left=this.cx-w/2, top=this.cy-h/2;
    const z=this.z, ts=256;
    const x0=Math.floor(left/ts), x1=Math.floor((left+w)/ts);
    const y0=Math.floor(top/ts), y1=Math.floor((top+h)/ts);
    let html="";
    for(let x=x0;x<=x1;x++){
      for(let y=y0;y<=y1;y++){
        const px=x*ts-left, py=y*ts-top;
        html+=`<img class="rm-t" src="${this._tileUrl(x,y)}" data-x="${x}" data-y="${y}" style="left:${px}px;top:${py}px" draggable="false">`;
      }
    }
    // path
    if(this.path.length>1){
      const pts=this.path.map(([px,py])=>`${(px-left).toFixed(1)},${(py-top).toFixed(1)}`).join(" ");
      html+=`<svg class="rm-svg" width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="#00B42A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>`;
    }
    // markers
    this.markers.forEach(m=>{
      const px=m.x-left-10, py=m.y-top-10;
      html+=`<div class="rm-mk ${m.on?"on":""}" style="left:${px}px;top:${py}px" title="${m.tip||""}">${m.label}</div>`;
    });
    this.canvas.innerHTML=html;
    // 本地瓦片失败 → 高德在线
    this.canvas.querySelectorAll("img.rm-t").forEach(img=>{
      img.onerror=()=>{
        if(!img.dataset.f){img.dataset.f="1";img.src=this._tileUrlNet(+img.dataset.x,+img.dataset.y);}
        else img.style.visibility="hidden";
      };
    });
  }
}

function synth(n,dist,dur){
  const pts=[],ts0=Math.floor(Date.now()/1000)-dur,o=[117.5966,31.6083];
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const lon=o[0]+0.0008*t+(i%2?0.0003:-0.0003)*t*(dist/2.2);
    const lat=o[1]+0.0005*t+(i%3?0.0002:-0.0002)*t*(dist/2.2);
    pts.push({point:lon.toFixed(8)+","+lat.toFixed(8),runStatus:"1",
      speed:(4.6+Math.random()*0.6).toFixed(2),isFence:"Y",isMock:false,
      runMileage:(dist*1000*(i+1)/n).toFixed(4),runTime:String(Math.floor(dur*(i+1)/n)),
      ts:String(ts0+Math.floor(dur*(i+1)/n))});
  }
  return pts;
}

function doTV(){
